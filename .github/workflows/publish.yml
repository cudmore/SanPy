name: Publish sanpy-ephys to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish (for example, v0.2.4)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
    env:
      PUBLISH_TAG: ${{ inputs.tag }}
      UV_PYTHON: "3.11"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.12.8"
          enable-cache: false

      - name: Install Python
        run: uv python install 3.11

      - name: Validate tag
        shell: bash
        run: |
          case "${PUBLISH_TAG}" in
            v*) ;;
            *) echo "error: tag must start with v" >&2; exit 1 ;;
          esac
          test "$(git describe --tags --exact-match)" = "${PUBLISH_TAG}"

      - name: Validate lockfile
        run: uv lock --check

      - name: Build
        run: uv build

      - name: Validate distributions
        run: |
          uvx --from twine twine check dist/*
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1

      - name: Smoke test wheel
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          uv venv --python 3.11 .publish-venv
          uv pip install --python .publish-venv/bin/python "${wheel}"
          .publish-venv/bin/python -c "import os; import sanpy; import importlib.metadata as m; assert m.version('sanpy-ephys') == os.environ['PUBLISH_TAG'][1:]"
          test -x .publish-venv/bin/sanpy

      - name: Publish
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

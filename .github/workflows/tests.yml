name: Tests

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.11"
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked --group dev

      - name: Lint
        run: uv run --no-sync ruff check sanpy

      - name: Test
        run: uv run --no-sync pytest --cov=sanpy --cov-report=xml

      - name: Upload coverage
        if: matrix.os == 'macos-latest' && hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@v5

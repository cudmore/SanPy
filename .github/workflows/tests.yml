name: Tests

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.8"
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install 3.11
          uv sync --locked --group dev

      - name: Lint
        run: uv run --locked ruff check sanpy

      - name: Test core analysis
        run: |
          uv run --locked coverage erase
          uv run --locked pytest tests/test_analysisDir.py --cov=sanpy --cov-append
          uv run --locked pytest tests/test_analysis.py tests/test_detection.py tests/test_fileLoader.py tests/test_metadata.py --cov=sanpy --cov-append

      - name: Test interface
        run: uv run --locked pytest tests/interface

      - name: Create coverage report
        run: uv run --locked coverage xml -o coverage.xml

      - name: Upload coverage
        if: matrix.os == 'macos-latest' && hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@v5

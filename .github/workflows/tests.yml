name: Tests

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.12.8"
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked

      - name: Lint
        run: uv run ruff check sanpy

      - name: Test
        run: |
          uv run coverage erase
          uv run pytest tests/test_analysisDir.py --cov=sanpy --cov-append
          uv run pytest tests/test_analysis.py tests/test_detection.py tests/test_fileLoader.py tests/test_metadata.py --cov=sanpy --cov-append
          uv run pytest tests/interface
          uv run coverage xml -o coverage.xml

      - name: Upload coverage
        if: matrix.os == 'macos-latest'
        uses: codecov/codecov-action@v5

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "sanpy-ephys"
dynamic = ["version"]
description = "Whole cell current-clamp analysis."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "GPL-3.0-only"
authors = [
    { name = "Robert H Cudmore", email = "robert.cudmore@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "h5py>=3.12,<4",
    "jsonschema>=4.26,<5",
    "matplotlib>=3.9,<4",
    "mplcursors>=0.6,<1",
    "numcodecs>=0.16,<0.17",
    "numpy>=2.1,<3",
    "pandas>=2.3,<2.4",
    "platformdirs>=4.3,<5",
    "pyabf==2.3.8",
    "pyarrow>=19,<24",
    "PyQt5==5.15.11",
    "pyqtdarktheme-fork==2.3.6",
    "pyqtgraph>=0.13.7,<1",
    "QtPy>=2.4,<3",
    "requests>=2.32,<3",
    "scikit-image>=0.25,<1",
    "scipy>=1.15,<2",
    "seaborn>=0.13,<1",
    "tables>=3.10,<4",
    "tifffile>=2025.1,<2027",
    "zarr>=3.1,<4",
]

[project.urls]
Homepage = "https://github.com/cudmore/SanPy"
Documentation = "https://cudmore.github.io/SanPy/"
Issues = "https://github.com/cudmore/SanPy/issues"

[project.gui-scripts]
sanpy = "sanpy.interface.sanpy_app:main"

[dependency-groups]
packaging = [
    "pyinstaller==6.22.2",
    "pyinstaller-hooks-contrib==2026.7",
]
test = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "pytest-qt>=4,<5",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-jupyter>=0.25,<0.26",
    "mkdocs-material>=9,<10",
    "mkdocstrings[python]>=0.30,<1",
]
dev = [
    { include-group = "test" },
    "build>=1.3,<2",
    "ruff>=0.13,<1",
]

[tool.setuptools.packages.find]
include = ["sanpy", "sanpy.*"]

[tool.setuptools.package-data]
sanpy = [
    "_userFiles/**/*",
    "detection-presets/*.json",
    "io/zarr_export/schemas/*.json",
    "models/*.mmt",
]
"sanpy.interface" = [
    "css/*.css",
    "icons/*.icns",
    "icons/*.png",
]

[tool.setuptools_scm]
write_to = "sanpy/_version.py"
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
constraint-dependencies = [
    "PyQt5-Qt5==5.15.2; sys_platform == 'win32'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = ["E501"]
select = ["E9", "F63", "F7", "F82"]

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "sanpy-ephys"
dynamic = ["version"]
description = "Whole cell current-clamp analysis."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "GPL-3.0-only"
authors = [
    { name = "Robert H Cudmore", email = "robert.cudmore@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "h5py==3.8.0",
    "matplotlib==3.7.1",
    "mplcursors==0.5.2",
    "numpy==1.26.4",
    "pandas==2.3.3",
    "platformdirs==4.11.6",
    "pyabf==2.3.8",
    "PyQt5==5.15.11",
    "pyqtdarktheme==2.1.0",
    "pyqtgraph==0.13.1",
    "QtPy==2.4.3",
    "requests==2.34.2",
    "scikit-image==0.20.0",
    "scipy==1.10.1",
    "seaborn==0.12.2",
    "tables==3.10.2",
    "tifffile==2026.3.3",
]

[project.optional-dependencies]
zarr-export = [
    "jsonschema>=4.26,<5",
    "numcodecs>=0.16,<0.17",
    "zarr>=3.1,<4",
]
zarr-export-parquet = [
    "jsonschema>=4.26,<5",
    "numcodecs>=0.16,<0.17",
    "pyarrow>=16,<17",
    "zarr>=3.1,<4",
]

[project.urls]
Homepage = "https://github.com/cudmore/SanPy"
Documentation = "https://cudmore.github.io/SanPy/"
Issues = "https://github.com/cudmore/SanPy/issues"

[project.gui-scripts]
sanpy = "sanpy.interface.sanpy_app:main"

[dependency-groups]
packaging = [
    "pyinstaller==6.22.2",
    "pyinstaller-hooks-contrib==2026.7",
]
test = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "pytest-qt>=4,<5",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-jupyter>=0.25,<0.26",
    "mkdocs-material>=9,<10",
    "mkdocstrings[python]>=0.30,<1",
]
dev = [
    { include-group = "test" },
    "build>=1.3,<2",
    "ruff>=0.13,<1",
]

[tool.setuptools.packages.find]
include = ["sanpy", "sanpy.*"]

[tool.setuptools.package-data]
sanpy = [
    "_userFiles/**/*",
    "detection-presets/*.json",
    "io/zarr_export/schemas/*.json",
    "models/*.mmt",
]
"sanpy.interface" = [
    "css/*.css",
    "icons/*.icns",
    "icons/*.png",
]

[tool.setuptools_scm]
write_to = "sanpy/_version.py"
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
constraint-dependencies = [
    "blosc2==2.5.1",
    "contourpy==1.0.5",
    "numexpr==2.8.4",
    "PyQt5-Qt5==5.15.2; sys_platform == 'win32'",
    "PyWavelets==1.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = ["E501"]
select = ["E9", "F63", "F7", "F82"]
